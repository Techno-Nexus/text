<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | FoodExpress</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --brand: #ff7a1a;
      --brand-dark: #db5d00;
      --shadow: 0 20px 40px rgba(35, 24, 18, 0.12);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(180deg, #fffaf6 0%, #fff7ef 40%, #fff 100%);
      color: #2b2b2b;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .navbar {
      background: rgba(23, 19, 18, 0.78);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      position: absolute;
      top: 0;
      width: 100%;
      z-index: 10;
    }
    .navbar-brand { font-size: 1.5rem; font-weight: 800; color: #ffb066 !important; }
    .auth-container {
      width: 100%;
      max-width: 450px;
      padding: 2rem;
    }
    .auth-card {
      background: white;
      border-radius: 32px;
      padding: 3rem 2rem;
      box-shadow: var(--shadow);
      border: none;
    }
    .icon-circle {
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      background: linear-gradient(135deg, var(--brand) 0%, #ff9e45 100%);
      border-radius: 50%;
      color: white;
      font-size: 2rem;
    }
    .form-control {
      border-radius: 18px !important;
      padding: 0.8rem 1.2rem !important;
      border: 1px solid #e5e7eb !important;
      font-size: 0.95rem;
    }
    .form-control:focus {
      border-color: var(--brand) !important;
      box-shadow: 0 0 0 3px rgba(255, 122, 26, 0.1);
    }
    .btn-warning { background: linear-gradient(135deg, var(--brand) 0%, #ff9e45 100%); color: #fff; border: none; font-weight: 700; }
    .btn-warning:hover { background: linear-gradient(135deg, var(--brand-dark) 0%, #f07c14 100%); }
    .social-btn {
      padding: 0.8rem;
      border-radius: 18px;
      border: 1px solid #e5e7eb;
      background: white;
      cursor: pointer;
      transition: 0.25s;
      font-weight: 600;
      width: 100%;
    }
    .social-btn:hover {
      border-color: var(--brand);
      background: rgba(255, 122, 26, 0.05);
    }
    .divider { text-align: center; color: #999; margin: 1.5rem 0; position: relative; }
    .divider::before { content: ""; position: absolute; left: 0; top: 50%; width: 100%; height: 1px; background: #e5e7eb; }
    .divider span { position: relative; background: white; padding: 0 1rem; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html"><i class="fa-solid fa-utensils me-2"></i>FoodExpress</a>
  </div>
</nav>

<div class="auth-container">
  <div class="auth-card">
    <div class="icon-circle">
      <i class="fa-solid fa-user"></i>
    </div>
    
    <h2 class="text-center fw-bold mb-2" style="letter-spacing: -0.05em;">Welcome back</h2>
    <p class="text-center text-muted mb-4">Sign in to your FoodExpress account</p>

    <form>
      <div class="mb-3">
        <label class="form-label fw-semibold">Email or Phone</label>
        <input type="email" class="form-control form-control-lg" placeholder="you@example.com">
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Password</label>
        <input type="password" class="form-control form-control-lg" placeholder="••••••••">
      </div>

      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="remember">
          <label class="form-check-label" for="remember">Remember me</label>
        </div>
        <a href="#" class="text-warning text-decoration-none fw-bold">Forgot password?</a>
      </div>

      <button type="button" class="btn btn-warning btn-lg w-100 mb-3">Sign In</button>
    </form>

    <div class="divider"><span>or continue with</span></div>

    <div class="d-grid gap-2 mb-4">
      <button class="social-btn"><i class="fa-brands fa-google me-2"></i> Google</button>
      <button class="social-btn"><i class="fa-brands fa-facebook me-2"></i> Facebook</button>
    </div>

    <p class="text-center mb-0">
      Don't have an account? 
      <a href="register.html" class="text-warning fw-bold text-decoration-none">Create one</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
